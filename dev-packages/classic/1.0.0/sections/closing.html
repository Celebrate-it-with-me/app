<div class="pkg-sec pkg-sec--deep">
  <div class="pkg-sec-decor" aria-hidden="true">
    <span class="pkg-sprig pkg-sprig--tl" aria-hidden="true"><span class="pkg-sprig__stem"></span><span class="pkg-sprig__bloom"></span></span>
    <span class="pkg-sprig pkg-sprig--br" aria-hidden="true"><span class="pkg-sprig__stem"></span><span class="pkg-sprig__bloom"></span></span>
  </div>
  <div class="pkg-sec__in">
    <span class="pkg-flourish" aria-hidden="true"></span>
    <h2 data-if="section.title" class="pkg-sec__title">{{section.title}}</h2>
    <p data-if="section.text" class="pkg-sec__text">{{section.text}}</p>
    <div class="pkg-sec__body"><q-closing></q-closing></div>
  </div>
</div>

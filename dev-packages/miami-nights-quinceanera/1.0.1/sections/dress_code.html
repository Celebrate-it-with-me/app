<div class="pkg-section pkg-dress-code">
  <h2 class="pkg-heading" data-if="section.title">{{section.title}}</h2>
  <p class="pkg-script-line" data-if="section.text">{{section.text}}</p>
  <div class="pkg-attire" aria-hidden="true">
    <img class="pkg-attire__img" src="assets/img/dress.svg" alt="" width="200" height="320" loading="lazy" decoding="async">
    <img class="pkg-attire__img" src="assets/img/suit.svg" alt="" width="160" height="320" loading="lazy" decoding="async">
  </div>
  <div class="pkg-content"><q-dress-code frame="bare" variant="swatches"></q-dress-code></div>
</div>

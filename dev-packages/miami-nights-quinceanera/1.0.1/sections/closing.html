<div class="pkg-closing">
  <img class="pkg-divider" src="assets/img/deco-divider.svg" alt="" width="240" height="40" loading="lazy" decoding="async">
  <h2 class="pkg-thanks" data-if="section.title">{{section.title}}</h2>
  <p class="pkg-closing-text" data-if="section.text">{{section.text}}</p>
  <p class="pkg-signature">{{event.name}}</p>
  <img class="pkg-skyline" src="assets/img/skyline.webp" alt="" width="1200" height="400" loading="lazy" decoding="async">
</div>
